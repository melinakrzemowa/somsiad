name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # A broken rule file must never reach the Air: Prometheus would refuse
      # the reload and keep evaluating the old rules without a word. Same
      # images as docker-compose.yml.
      - name: Validate Prometheus and Alertmanager config, run rule tests
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint sh \
            prom/prometheus:v3.1.0 -c 'promtool test rules /etc/prometheus/tests/*.yml'
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Install cloudflared
        run: |
          curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Setup SSH key and config
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'EOF'
          Host airssh.melinakrzemowa.pl
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Sync configs and (re)start stack
        run: |
          DEPLOY_DIR=/Users/${{ secrets.SSH_USERNAME }}/services/monitoring.melinakrzemowa.pl
          SSH_TARGET=${{ secrets.SSH_USERNAME }}@airssh.melinakrzemowa.pl

          # Make sure target dir exists.
          ssh $SSH_TARGET "mkdir -p $DEPLOY_DIR"

          # Sync everything except host-only secret files. --exclude with
          # --delete also protects matched paths from being removed on the
          # destination, so files listed here survive across deploys.
          rsync -az --delete \
            --exclude='.env' --exclude='.env.local' \
            --exclude='.git' --exclude='.github' \
            --exclude='volumes' --exclude='.DS_Store' \
            --exclude='alertmanager/smtp_password' \
            --exclude='scripts/last_run.html' \
            --exclude='scripts/last_run.txt' \
            --exclude='scripts/last_run.log' \
            --exclude='scripts/launchd.out.log' \
            --exclude='scripts/launchd.err.log' \
            --exclude='scripts/air_watchdog.out.log' \
            --exclude='scripts/air_watchdog.err.log' \
            --exclude='scripts/air_watchdog_state.json' \
            --exclude='scripts/battery_textfile.out.log' \
            --exclude='scripts/battery_textfile.err.log' \
            --exclude='scripts/updates_textfile.out.log' \
            --exclude='scripts/updates_textfile.err.log' \
            -e "ssh" \
            ./ $SSH_TARGET:$DEPLOY_DIR/

          # Pull any updated images and restart.
          ssh $SSH_TARGET << 'DEPLOY'
            set -e
            cd /Users/${{ secrets.SSH_USERNAME }}/services/monitoring.melinakrzemowa.pl
            test -f .env || { echo "ERROR: .env missing on host. Create it from .env.example."; exit 1; }
            # `up --build --pull missing`: pulls anything new from registries
            # AND rebuilds locally-defined services (docker-names-exporter)
            # whose image isn't on any registry. --remove-orphans cleans up
            # services we removed in the compose file.
            docker compose up -d --build --pull missing --remove-orphans
            docker compose ps
            # Bind-mounted config-only changes (prometheus.yml, alerts.yml)
            # don't restart their container, so trigger a hot reload here.
            # Each POST comes from the prometheus container over the compose
            # network (Alloy's image has no wget/curl). A service still warming
            # up gets a few retries; a reload that keeps failing (a config the
            # container cannot read or parse, which leaves the OLD config
            # running) fails the deploy instead of passing silently.
            # NOT `docker kill --signal=HUP`: docker kill (any signal) marks the
            # container "manually stopped", so restart:unless-stopped skips it on
            # the next VM boot — alertmanager stayed down after a host reboot.
            reload() {
              for attempt in 1 2 3 4 5 6; do
                docker exec monitoringmelinakrzemowapl-prometheus-1 \
                  wget -q --post-data='' -O /dev/null "$2" && return 0
                sleep 5
              done
              echo "ERROR: $1 refused the config reload ($2); see: docker compose logs $1" >&2
              return 1
            }
            reload prometheus http://localhost:9090/-/reload
            reload alloy http://alloy:12345/-/reload
            reload alertmanager http://alertmanager:9093/-/reload
          DEPLOY
