global:
  smtp_smarthost: 'h18.seohost.pl:465'
  smtp_from: 'alert@melinakrzemowa.pl'
  smtp_auth_username: 'alert@melinakrzemowa.pl'
  smtp_auth_password_file: '/etc/alertmanager/smtp_password'
  smtp_require_tls: false  # SMTPS (implicit TLS) on 465
  smtp_hello: 'monitoring.melinakrzemowa.pl'

route:
  receiver: email
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: email
    email_configs:
      - to: 'kelostrada@gmail.com'
        send_resolved: true
        headers:
          Subject: '[somsiad] {{ .Status | toUpper }} {{ if eq .Status "firing" }}({{ .Alerts.Firing | len }}){{ end }} {{ .CommonLabels.alertname }}'

inhibit_rules:
  # If a probed service is down, suppress its scrape and error-rate alerts.
  - source_matchers: [alertname="ServiceDown"]
    target_matchers: [alertname=~"PhoenixScrapeDown|PhoenixHighErrorRate"]
    equal: [target]

  # A site that's fully down also trips the slow-probe threshold — the "down"
  # alert is the actionable one, so don't send both for the same target.
  - source_matchers: [alertname="KelostradaSiteDown"]
    target_matchers: [alertname="KelostradaSiteSlow"]
    equal: [target]
