global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: somsiad

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: alloy
    static_configs:
      - targets: [alloy:12345]

  # cAdvisor — per-container CPU/RAM/IO. Has to run as a dedicated
  # privileged container to see other containers' cgroups; Alloy's
  # bundled cadvisor exporter only sees the root cgroup from inside
  # an unprivileged container.
  # Maps Docker container ID -> name+image. cAdvisor on Colima only knows
  # cgroup IDs; this lets PromQL queries join names back via container_id.
  - job_name: docker-names
    scrape_interval: 30s
    static_configs:
      - targets: [docker-names:9101]
    metric_relabel_configs:
      # A `service` label for containers whose compose names do not say which
      # app they belong to (the same names as the Loki `service` label in
      # alloy/config.alloy), so cAdvisor series joined through this metric can
      # be grouped per app: `* on (container_id) group_left(name, service)
      # docker_container_info`. The migrate one-off (ania-app-run-*) counts as
      # the app.
      - source_labels: [name]
        regex: 'ania-app-.*'
        target_label: service
        replacement: aniasienudzi
      - source_labels: [name]
        regex: 'ania-db-.*'
        target_label: service
        replacement: aniasienudzi-db

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      # cAdvisor on Colima only emits the cgroup `id` (e.g. /docker/<full-id>);
      # the Docker factory is disabled because Colima's overlayfs layout
      # breaks it. Extract the first 12 chars of the container ID into a
      # short `container_id` label for joins with docker_container_info.
      - source_labels: [id]
        regex: '/docker/([0-9a-f]{12})[0-9a-f]*'
        target_label: container_id
        replacement: '${1}'
      # Drop the noisy raw cgroup leaf series that aren't /docker/* —
      # we only want per-container metrics.
      - source_labels: [id]
        regex: '/(system\.slice|user\.slice|init\.scope).*'
        action: drop

  # macOS host metrics from node_exporter (brew install node_exporter, brew services start)
  # Bound to all interfaces on :9100; reachable from containers via host.docker.internal.
  - job_name: host
    static_configs:
      - targets: [host.docker.internal:9100]
        labels: { service: host }

  - job_name: loki
    static_configs:
      - targets: [loki:3100]
        labels: { service: loki }

  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
        labels: { service: tempo }

  # Phoenix apps — exposed via prom_ex on the same port as the app.
  # (Will start returning data once prom_ex is wired up; until then this
  #  scrape job will fail and the "service down" alert will fire on those.)
  # PromEx prefixes metrics with `<otp_app>_prom_ex_<namespace>_*`. Strip the
  # `<otp_app>_prom_ex_` part so dashboards use unified names (e.g. `phoenix_*`,
  # `beam_*`) regardless of which app emits them. The `service` label still
  # distinguishes apps.
  - job_name: instagrain
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:4163]
        labels: { service: instagrain }
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'instagrain_prom_ex_(.+)'
        target_label: __name__
        replacement: '${1}'

  - job_name: sribia
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:6900]
        labels: { service: sribia }
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'abyss_prom_ex_(.+)'
        target_label: __name__
        replacement: '${1}'

  # aniasienudzi (ania.kelostrada.pl, repo kelostrada/aniasienudzi). PromEx
  # runs on its own listener, published on the Air's 127.0.0.1:4019 only and
  # never in the tunnel (the app itself is 4018). PromEx names are
  # ania_prom_ex_*; the app's own counters (ania_mailer_*, ania_emails_*,
  # ania_integration_*, later ania_push_*, ania_retention_*, ania_db_*) have no
  # prom_ex part and pass through unchanged.
  - job_name: aniasienudzi
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:4019]
        labels: { service: aniasienudzi }
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'ania_prom_ex_(.+)'
        target_label: __name__
        replacement: '${1}'

  # Ente museum (self-hosted photos). Go service, not Phoenix — metrics are
  # plain Go/Gin names, so no prom_ex prefix stripping is needed. Port 4017 on
  # the Air's loopback maps to the container's 2112; it is deliberately not in
  # the Cloudflare tunnel. Distinct from the blackbox probe: the edge probe can
  # pass while the Go process is wedged behind it.
  - job_name: ente
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:4017]
        labels: { service: ente }

  # cAdvisor and blackbox metrics arrive via remote_write from Alloy
  # (see alloy/config.alloy). They show up under their own metric names
  # (container_*, probe_*) without an explicit scrape job here.
