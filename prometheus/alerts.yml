groups:
  - name: uptime
    interval: 30s
    rules:
      - alert: ServiceDown
        # probe_success comes from blackbox; the `target` label is added in alloy/config.alloy.
        # (every site lives on the Air since 2026-08-20 — no special cases left)
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.target }} is down"
          description: "HTTP probe to {{ $labels.target }} has failed for 2+ minutes."

      - alert: ProbeChallenged
        # A 403 on a plain public site means Cloudflare answered with a bot
        # challenge instead of the origin — the probe passes (403 is a valid
        # code, for Access-protected targets) but tests nothing. Usually means
        # the WAF skip rule for the somsiad-blackbox User-Agent was removed.
        expr: probe_http_status_code == 403
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }} probe is being challenged"
          description: "The blackbox probe for {{ $labels.target }} receives an edge-served 403, so the origin is not actually being tested. Check the Cloudflare WAF skip rule for User-Agent somsiad-blackbox/1.0."

      - alert: BackupFailed
        # The nightly air-backup run (launchd 03:30, script in air-infra repo)
        # reports via node_exporter textfile metrics. Any failed step -> 0.
        expr: somsiad_backup_success == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "nightly backup failed"
          description: "The last air-backup run had at least one failed step. Check ~/backups/backup.log on the Air."

      - alert: BackupStale
        # No successful run in >28h (daily schedule + slack), or the metric
        # disappeared entirely (textfile wiped, node_exporter down).
        expr: (time() - somsiad_backup_last_run_timestamp) > 100800 or absent(somsiad_backup_last_run_timestamp)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "nightly backup is stale"
          description: "No air-backup run recorded in over 28 hours. launchd agent com.melinakrzemowa.air-backup may be unloaded, or the Air was asleep."

      - alert: PhoenixScrapeDown
        # If a Phoenix app's /metrics is unreachable, prom_ex is down (or the
        # app is down — either way, investigate).
        # `target` names the blackbox target of the same app (the job names
        # match), so the ServiceDown inhibit rule in alertmanager.yml can
        # suppress this one while the whole site is down.
        expr: up{job=~"instagrain|sribia|aniasienudzi"} == 0
        for: 5m
        labels:
          severity: warning
          target: '{{ $labels.job }}'
        annotations:
          summary: "{{ $labels.job }} /metrics unreachable"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."

  - name: containers
    interval: 30s
    rules:
      - alert: ContainerRestartLoop
        expr: increase(container_last_seen[10m]) == 0 and rate(container_cpu_usage_seconds_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} appears stuck"
          description: "Container has not made progress for 5+ minutes."

      - alert: HighContainerMemory
        # Working set, NOT container_memory_usage_bytes. usage_bytes counts page
        # cache, which the kernel reclaims on demand — a container doing steady
        # disk writes fills its cgroup to 100% with cache by design, so usage_bytes
        # fires on perfectly healthy containers. Working set (usage minus inactive
        # file cache) is what the OOM killer actually weighs.
        # Seen 2026-09-18 during an Ente photo import: MinIO at 100% usage_bytes,
        # 48% working set, 34% RSS, never OOM-killed.
        #
        # cAdvisor under Colima emits only the cgroup id, never `name`, so the old
        # annotation rendered as "Container  >90%" with a blank. Join
        # docker_container_info (value 1, carries `name`) to say which one it is.
        # `limit > 0` drops unlimited containers, whose ratio would be +Inf.
        expr: |
          (
            (
              container_memory_working_set_bytes{container_id!=""}
                / (container_spec_memory_limit_bytes{container_id!=""} > 0)
            ) > 0.9
          )
          * on (container_id) group_left(name) docker_container_info
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} >90% memory"
          description: "Working set on {{ $labels.name }} has been above 90% of its memory limit for 10m ({{ $value | humanizePercentage }}). This excludes reclaimable page cache, so it is real pressure — check for a leak or raise mem_limit."

      - alert: ColimaMemoryLow
        # Every container runs in the one Colima VM, which has no swap: when it
        # runs out, the kernel OOM killer picks a victim from any stack. This is
        # MemAvailable (the kernel's estimate of what can still be allocated
        # without swapping) from Alloy's embedded node exporter, meminfo only
        # (job "colima" in alloy/config.alloy; /proc/meminfo is VM-wide even
        # inside a container). Not cAdvisor's root cgroup: its working set
        # leaves out the kernel memory no cgroup is charged for, ~350 MiB here
        # (2026-09-29: 83% used by working set, 89% by MemAvailable), so it
        # would fire only just before the OOM killer.
        expr: node_memory_MemAvailable_bytes{job="colima"} / node_memory_MemTotal_bytes{job="colima"} < 0.08
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Colima VM memory low ({{ $value | humanizePercentage }} available)"
          description: "Less than 8% of the Colima VM's memory has been available for 10m, and the VM has no swap, so the next spike OOM-kills a container of any stack. The Overview dashboard's memory panel shows the biggest containers. Remedy order: trim the shop's and fossil's MariaDB buffer pools, then add a 1-2 GB swap file inside the VM, only then give Colima more memory (macOS itself needs ~1.5-2 GB)."

  - name: phoenix
    interval: 1m
    rules:
      - alert: PhoenixHighErrorRate
        # prom_ex exposes phoenix_http_request_duration_milliseconds_count with `status` (HTTP status code).
        # Fire if 5xx rate is > 5% over the last 10 minutes and at least 10 reqs/min.
        expr: |
          (
            sum by (job) (rate(phoenix_http_request_duration_milliseconds_count{status=~"5.."}[10m]))
            /
            sum by (job) (rate(phoenix_http_request_duration_milliseconds_count[10m]))
          ) > 0.05
          and
          sum by (job) (rate(phoenix_http_request_duration_milliseconds_count[10m])) > 10/60
        for: 10m
        labels:
          severity: warning
          target: '{{ $labels.job }}'
        annotations:
          summary: "{{ $labels.job }} 5xx rate >5%"
          description: "Phoenix app {{ $labels.job }} has been returning 5xx for >5% of requests over 10m."

  # aniasienudzi (ania.kelostrada.pl, repo kelostrada/aniasienudzi: PLAN §9.5,
  # backend §14.3). Covered by the shared rules above: site down, database
  # down and pending migrations by ServiceDown (the probe is /readyz, which
  # answers 503 for all three); /metrics unreachable by PhoenixScrapeDown; the
  # 5xx ratio by PhoenixHighErrorRate; a container near its mem_limit by
  # HighContainerMemory. Rules on a series a later app release adds
  # (ania_push_failures_total, ania_db_table_bytes,
  # ania_retention_last_success_timestamp_seconds) stay silent until it exists.
  - name: aniasienudzi
    interval: 1m
    rules:
      - alert: AniaHighLatency
        # p95 of the API over 15 minutes. The histogram has a bucket boundary
        # at 500 ms, so this reads "more than 5% of API requests took over
        # 500 ms". The floor of 30 requests per window keeps a few slow
        # requests on a quiet night from paging.
        expr: |
          histogram_quantile(0.95,
            sum by (job, le) (rate(phoenix_http_request_duration_milliseconds_bucket{job="aniasienudzi", path=~"/api/.*"}[15m]))
          ) > 500
          and on (job)
          sum by (job) (increase(phoenix_http_request_duration_milliseconds_count{job="aniasienudzi", path=~"/api/.*"}[15m])) >= 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi API p95 latency above 500 ms"
          description: "The 95th percentile of API requests has been {{ $value | humanize }} ms over the last 15m (spec target: under 300 ms). Phoenix App dashboard (service aniasienudzi): latency, Oban and BEAM memory; slow queries (over 200 ms) are logged with their source."

      - alert: AniaObanBacklog
        # Jobs ready to run piling up in one queue. The app's ObanBacklog
        # plugin counts the jobs still to run by queue and state every 30 s.
        expr: sum by (job, queue) (oban_queue_length_count{job="aniasienudzi", state="available"}) > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi Oban queue {{ $labels.queue }} has {{ $value }} jobs waiting"
          description: "More than 500 jobs have been available (ready, not started) in queue {{ $labels.queue }} for 5m. Check Oban Web under /admin and the app logs for the worker that is slow or failing."

      - alert: AniaObanQueueStuck
        # Jobs waiting in a queue for 10+ minutes while not one job of that
        # queue finished: the queue is paused, its workers hang, or long jobs
        # hold every slot. This stands in for "oldest job older than 5
        # minutes": the job wait histogram tops out at 20 s, so it cannot
        # measure minutes.
        expr: |
          min_over_time(sum by (job, queue) (oban_queue_length_count{job="aniasienudzi", state="available"})[10m:1m]) > 0
          unless on (job, queue)
          sum by (job, queue) (increase({__name__=~"oban_job_(processing|exception)_duration_milliseconds_count", job="aniasienudzi"}[10m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi Oban queue {{ $labels.queue }} is not moving"
          description: "Queue {{ $labels.queue }} has had jobs waiting for 15m and finished none of them. Check Oban Web under /admin (is the queue paused, which jobs are executing) and the app logs."

      - alert: AniaMailDeliveryFailing
        # Every failed attempt counts (mail jobs retry with backoff). A mailer
        # without SMTP credentials discards mail instead of failing, so it stays
        # quiet here; see AniaMailerDisabled.
        expr: increase(ania_mailer_failures_total{job="aniasienudzi"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi cannot send e-mail"
          description: "{{ $value | humanize }} e-mail send(s) failed in the last hour, so login codes may not arrive. The app logs 'mail: <template> failed (job <id>): <reason>' and the error is in /admin/errors: a 535 reply means wrong credentials, a timeout a blocked port. Runbook: 'When mail does not arrive' in the aniasienudzi docs/RUNBOOK.md."

      - alert: AniaMailerDisabled
        # The mailer has had no complete SMTP configuration for a whole week,
        # so nobody receives a login code by e-mail. The gauge arrives with the
        # M1 release, so this cannot fire before M1. max_over_time rather than
        # `for: 7d`: every deploy restarts the app, and one missed scrape would
        # reset a pending `for`. The offset clause waits until the series is a
        # week old.
        expr: |
          max by (job) (max_over_time(ania_integration_enabled{job="aniasienudzi", integration="mailer"}[7d])) == 0
          and on (job)
          max by (job) (present_over_time(ania_integration_enabled{job="aniasienudzi", integration="mailer"}[1h] offset 7d)) == 1
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "aniasienudzi mailer disabled for over a week"
          description: "The mailer has been disabled (no complete SMTP_* / MAIL_FROM group in the Air's .env) for 7+ days: sign-in e-mails are dropped. Fill in the SMTP values and run `docker compose up -d app` in ~/services/ania.kelostrada.pl; /readyz then shows \"mailer\":\"smtp\" (aniasienudzi docs/RUNBOOK.md, Email)."

      - alert: AniaPushVapidFailing
        # Push services answer 400/401/403 to our VAPID signature: the key pair
        # or VAPID_SUBJECT is wrong or was rotated, so no push is delivered.
        # The counter arrives with web push (aniasienudzi #114) and starts at 0.
        expr: increase(ania_push_failures_total{job="aniasienudzi", reason="vapid"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi push rejected (VAPID)"
          description: "{{ $value | humanize }} push(es) were rejected for their VAPID signature in the last 15m. Check VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY and VAPID_SUBJECT in the Air's .env."

      - alert: AniaDatabaseLarge
        # Table sizes come from the weekly DbHealth job (aniasienudzi #188),
        # so this takes each table's last value of the past 8 days: a deploy
        # restarts the app, which drops the gauge until the next Monday run.
        expr: sum by (job) (last_over_time(ania_db_table_bytes{job="aniasienudzi"}[8d])) > 5e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi database is over 5 GB"
          description: "The aniasienudzi tables total {{ $value | humanize1024 }}B. Find the table that grew (ania_db_table_bytes by table) and check the Retention cron; the database is dumped to the Pi every night, so size costs backup time too."

      - alert: AniaRetentionStale
        # The nightly Retention cron (02:30 Europe/Warsaw, aniasienudzi #188)
        # sets ania_retention_last_success_timestamp_seconds after each
        # successful run (and at boot). last_over_time over 7 days bridges
        # deploys.
        expr: time() - max by (job) (last_over_time(ania_retention_last_success_timestamp_seconds{job="aniasienudzi"}[7d])) > 26 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "aniasienudzi retention has not run for over 26 hours"
          description: "The last successful Retention run was {{ $value | humanizeDuration }} ago. Personal data past its retention period is being kept. Check Oban Web under /admin (maintenance queue) and the app logs for Ania.Maintenance.Workers.Retention."

  - name: prestashop
    interval: 1m
    rules:
      # All four metrics come from the nightly prestashop-prune run (launchd
      # 03:00, script in the air-infra repo) via the node_exporter textfile
      # dir, so they only refresh once a day — these alerts detect a trend,
      # not an incident, and can lag up to 24h by design.
      - alert: PrestashopDbOversized
        # The `sklep` DB sits around 400 MB pruned. It reached 8.7 GB by
        # 2026-09-17 because ps_facetedsearch cached every crawled filter
        # permutation forever, and backup.sh was dumping all of it to the Pi
        # nightly. 2 GB is ~5x normal: enough headroom for real catalogue
        # growth, low enough to catch a recurrence long before it hurts.
        expr: somsiad_prestashop_db_bytes > 2e9
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "kelostrada.pl database is oversized"
          description: "The sklep database is over 2 GB. Check which table grew: the usual culprit is pr_layered_filter_block refilling because crawlers are hitting ?q= filter URLs again — verify the Disallow rules are still in html/robots.txt (PrestaShop's admin overwrites that file when you regenerate it)."

      - alert: PrestashopFilterCacheRunaway
        # The prune script truncates this cache above 30k rows, so a sustained
        # breach means the crawl is outpacing the nightly cap.
        expr: somsiad_prestashop_filter_block_rows > 100000
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "faceted-search cache is running away"
          description: "pr_layered_filter_block is over 100k rows despite the nightly 30k cap, so something is crawling ?q= filter URLs faster than the prune can clear them. Check robots.txt and the top client IPs in the kelostradapl-web-1 access log."

      - alert: PrestashopPruneFailed
        expr: somsiad_prestashop_prune_success == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "PrestaShop prune failed"
          description: "The last prestashop-prune run had a failed step. Check ~/backups/prestashop-prune.log on the Air."

      - alert: PrestashopPruneStale
        # >28h (daily schedule + slack), or the metric vanished entirely.
        expr: (time() - somsiad_prestashop_prune_last_run_timestamp) > 100800 or absent(somsiad_prestashop_prune_last_run_timestamp)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "PrestaShop prune is stale"
          description: "No prestashop-prune run recorded in over 28 hours. launchd agent com.melinakrzemowa.prestashop-prune may be unloaded, or the Air was asleep."

  - name: ente
    interval: 30s
    rules:
      - alert: EnteMetricsDown
        # Museum's own /metrics. Distinct from the blackbox probe: the probe can
        # pass from the edge while the Go process is wedged behind it.
        expr: up{job="ente"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Ente museum /metrics unreachable"
          description: "Prometheus cannot scrape museum on {{ $labels.instance }}. Photos may still serve; check `docker compose logs museum` in ~/services/photos.kelostrada.pl."

      - alert: PhotoLibraryDiskLow
        # The photo library is the only unbounded-growth thing on this host, and
        # it shares the APFS container with every other service. Warn with room
        # to act — 50 GB is weeks of headroom at family-photo rates.
        expr: node_filesystem_avail_bytes{mountpoint="/System/Volumes/Data"} < 50e9
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Air disk below 50 GB free"
          description: "{{ $value | humanize1024 }}B free on /System/Volumes/Data. The Ente library at ~/services/photos.kelostrada.pl/minio-data is the likely grower; ~/backups also accumulates."

      - alert: PhotoLibraryDiskCritical
        expr: node_filesystem_avail_bytes{mountpoint="/System/Volumes/Data"} < 20e9
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Air disk below 20 GB free"
          description: "{{ $value | humanize1024 }}B free on /System/Volumes/Data. MinIO will start rejecting uploads and Postgres can wedge. Free space now."
