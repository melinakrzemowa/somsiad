groups:
  - name: uptime
    interval: 30s
    rules:
      - alert: ServiceDown
        # probe_success comes from blackbox; the `target` label is added in alloy/config.alloy.
        # kelostrada is excluded here — it has its own 5m rule below.
        # (fossil moved to the Air 2026-08-20 and is a normal service now.)
        expr: probe_success{target!~"kelostrada"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.target }} is down"
          description: "HTTP probe to {{ $labels.target }} has failed for 2+ minutes."

      - alert: KelostradaSiteDown
        # Bartosz's external site (kelostrada.pl, still on shared hosting) —
        # 5-minute window (was 1m). The origin (shared hosting) slows down
        # nightly — TTFB climbs to 4-7s between 22:00-01:00 local and
        # occasionally past the probe timeout, so short failure bursts are the
        # probe giving up on a slow response, not the site being down. See the
        # root-cause note in alloy/config.alloy. Measured over 12h: the longest
        # such burst was 4.5 min, and a 1m window sent 8 alert emails in that
        # period. 5m rides them out. Strict probe module: a Cloudflare
        # challenge/5xx counts as down, only 200/301/302 pass.
        expr: probe_success{target="kelostrada"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.target }} is down"
          description: "HTTP probe to {{ $labels.instance }} has failed for 5+ minutes (non-2xx/3xx or no response)."

      - alert: KelostradaSiteSlow
        # Degradation signal, deliberately NOT an outage signal — the sites
        # answer, just slowly. Uses probe_duration_seconds (total) rather than
        # the `processing` phase: a timed-out probe records processing=0, so
        # mean TTFB drops exactly when the site is worst and an average-based
        # alert would never fire (measured: the 15m mean never passed 1.3s even
        # through the worst night). Total duration is high both when the site
        # is slow and when it times out.
        #
        # Threshold is measured, not guessed. Out of ~60 probes per 30m window
        # the daytime baseline is 2-6 slow samples; the known nightly
        # 22:00-01:00 degradation peaks at 19-20. 25 sits above the worst
        # observed night, so this stays quiet for the expected nightly window
        # and only fires when the origin is worse than its own baseline.
        # Grounded in a single 12h sample — retune once more history exists.
        expr: count_over_time((probe_duration_seconds{target="kelostrada"} > 3)[30m:30s]) > 25
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.target }} is slow (responding, degraded)"
          description: "Over 40% of probes to {{ $labels.target }} in the last 30m took >3s. The site is up but degraded — typically origin/shared-hosting contention, not network (DNS/TCP/TLS stay fast during these episodes)."

      - alert: BackupFailed
        # The nightly air-backup run (launchd 03:30, script in air-infra repo)
        # reports via node_exporter textfile metrics. Any failed step -> 0.
        expr: somsiad_backup_success == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "nightly backup failed"
          description: "The last air-backup run had at least one failed step. Check ~/backups/backup.log on the Air."

      - alert: BackupStale
        # No successful run in >28h (daily schedule + slack), or the metric
        # disappeared entirely (textfile wiped, node_exporter down).
        expr: (time() - somsiad_backup_last_run_timestamp) > 100800 or absent(somsiad_backup_last_run_timestamp)
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "nightly backup is stale"
          description: "No air-backup run recorded in over 28 hours. launchd agent com.melinakrzemowa.air-backup may be unloaded, or the Air was asleep."

      - alert: PhoenixScrapeDown
        # If a Phoenix app's /metrics is unreachable, prom_ex is down (or the
        # app is down — either way, investigate).
        expr: up{job=~"instagrain|sribia"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} /metrics unreachable"
          description: "Prometheus cannot scrape {{ $labels.job }} on {{ $labels.instance }}."

  - name: containers
    interval: 30s
    rules:
      - alert: ContainerRestartLoop
        expr: increase(container_last_seen[10m]) == 0 and rate(container_cpu_usage_seconds_total[5m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} appears stuck"
          description: "Container has not made progress for 5+ minutes."

      - alert: HighContainerMemory
        # cAdvisor exposes container_memory_usage_bytes / container_spec_memory_limit_bytes.
        # Alert when a container is above 90% of its limit (only fires if a limit is set).
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9 and container_spec_memory_limit_bytes > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} >90% memory"
          description: "Memory usage on container {{ $labels.name }} has been above 90% for 10m."

  - name: phoenix
    interval: 1m
    rules:
      - alert: PhoenixHighErrorRate
        # prom_ex exposes phoenix_http_request_duration_milliseconds_count with `status` (HTTP status code).
        # Fire if 5xx rate is > 5% over the last 10 minutes and at least 10 reqs/min.
        expr: |
          (
            sum by (job) (rate(phoenix_http_request_duration_milliseconds_count{status=~"5.."}[10m]))
            /
            sum by (job) (rate(phoenix_http_request_duration_milliseconds_count[10m]))
          ) > 0.05
          and
          sum by (job) (rate(phoenix_http_request_duration_milliseconds_count[10m])) > 10/60
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.job }} 5xx rate >5%"
          description: "Phoenix app {{ $labels.job }} has been returning 5xx for >5% of requests over 10m."
